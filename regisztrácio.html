<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regisztráció - TechShop</title>
  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>


  <header class="navbar">
    <div class="nav-container">
      <div class="logo">
        <i class="fa-solid fa-cart-shopping"></i> TechShop
      </div>
      <nav class="nav-links">
        <a href="#">Főoldal</a>
        <a href="#">Termékek</a>
        <a href="#">Akciók</a>
        <a href="#">Kapcsolat</a>
      </nav>
      <div class="nav-icons">
        <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="#"><i class="fa-solid fa-user"></i></a>
        <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
      </div>
    </div>
  </header>


  <main class="main-content">
    <h1 class="page-title">Regisztráció</h1>
    <p class="page-subtitle">Hozd létre TechShop fiókodat!</p>

    <div class="card">
      <form action="#" method="POST">


        <div class="section-box">
          <h2 class="section-title">
            <i class="fa-solid fa-user icon-blue"></i> Személyes adatok
          </h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="fullname">Teljes név <span class="required">*</span></label>
              <input type="text" id="fullname" placeholder="Pl. Kovács Anna" required>
            </div>
            <div class="form-group">
              <label for="email">E-mail cím <span class="required">*</span></label>
              <input type="email" id="email" placeholder="pelda@email.hu" required>
            </div>
            <div class="form-group">
              <label for="password">Jelszó <span class="required">*</span></label>
              <input type="password" id="password" placeholder="••••••••••••" required>
              <small class="hint">A jelszónak legalább 8 karakterből kell állnia.</small>
            </div>
            <div class="form-group">
              <label for="password-confirm">Jelszó újra <span class="required">*</span></label>
              <input type="password" id="password-confirm" placeholder="••••••••••••" required>
            </div>
            <div class="form-group">
              <label for="dob">Születési dátum</label>
              <input type="date" id="dob" placeholder="ÉÉÉÉ. HH. NN.">
            </div>
            <div class="form-group">
              <label for="phone">Telefonszám</label>
              <input type="tel" id="phone" placeholder="+36 20 123 4567">
            </div>
            <div class="form-group full-width-sm">
              <label>Nem</label>
              <div class="radio-group">
                <label><input type="radio" name="gender" value="male" checked> Férfi</label>
                <label><input type="radio" name="gender" value="female"> Nő</label>
                <label><input type="radio" name="gender" value="unspecified"> Nem szeretném megadni</label>
              </div>
            </div>
            <div class="form-group">
              <label for="location">Lakóhely</label>
              <select id="location">
                <option value="">-- Válassz --</option>
                <option value="budapest">Budapest</option>
                <option value="pest">Pest megye</option>
                <option value="egyeb">Egyéb</option>
              </select>
            </div>
          </div>
        </div>


        <div class="section-box">
          <h2 class="section-title">
            <i class="fa-solid fa-truck icon-blue"></i> Szállítási adatok
          </h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="zip">Irányítószám</label>
              <input type="text" id="zip" placeholder="Pl. 1234">
            </div>
            <div class="form-group">
              <label for="city">Település</label>
              <input type="text" id="city" placeholder="Pl. Budapest">
            </div>
            <div class="form-group">
              <label for="street">Utca</label>
              <input type="text" id="street" placeholder="Pl. Kossuth Lajos utca">
            </div>
            <div class="form-group">
              <label for="house-number">Házszám</label>
              <input type="text" id="house-number" placeholder="Pl. 12.">
            </div>
          </div>
        </div>


        <div class="section-box">
          <h2 class="section-title">
            <i class="fa-solid fa-list-check icon-blue"></i> Egyéb beállítások
          </h2>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" name="newsletter">
              <span>Szeretnék hírlevelet kapni az akciókról és újdonságokról.</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="terms" checked required>
              <span>Elfogadom az <a href="#">Általános Szerződési Feltételeket (ÁSZF)</a>. <span class="required">*</span></span>
            </label>
          </div>

          <div class="form-group" style="margin-top: 15px;">
            <label for="notes">Megjegyzés</label>
            <textarea id="notes" maxlength="300" placeholder="Ide írhatod a megjegyzésedet (maximum 300 karakter) ..."></textarea>
            <div class="char-count">0/300</div>
          </div>
        </div>

        <!-- Gombok -->
        <div class="button-group">
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-user-plus"></i> Regisztráció
          </button>
          <button type="reset" class="btn btn-secondary">
            <i class="fa-solid fa-rotate-left"></i> Űrlap törlése
          </button>
        </div>

      </form>
    </div>
  </main>

</body>
</html>
